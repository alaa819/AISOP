services:
  aisop-api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: aisop-api

    env_file:
      - .env

    ports:
      - "8000:8000"

    volumes:
      - ./data:/app/data

    read_only: true

    tmpfs:
      - /tmp

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    restart: unless-stopped